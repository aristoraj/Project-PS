services:
  - type: web
    name: photo-selector
    runtime: node
    plan: free # sleeps after ~15 min idle (first visit then takes ~30-60s); use starter to avoid
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false # Postgres connection string (Neon, Supabase or Render Postgres)
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID # optional (OAuth mode)
        sync: false
      - key: GOOGLE_CLIENT_SECRET # optional (OAuth mode)
        sync: false
      - key: APP_URL
        sync: false # e.g. https://photo-selector.onrender.com
